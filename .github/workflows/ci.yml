name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC — weekly gate-audit run

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: '.'

  setup-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Bash syntax check all scripts
        run: |
          find bootstrap -name "*.sh" -print0 | xargs -0 -I{} bash -n {}
      - name: Lint prompt artifacts
        run: |
          shopt -s nullglob
          bash scripts/lint-prompts.sh bootstrap/agents/*.md bootstrap/commands/*.md bootstrap/skills/*/SKILL.md
      - name: Validate JSON/YAML
        run: |
          for f in bootstrap/templates/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))"
          done
      - name: Validate conftest.py template syntax
        run: python3 -m py_compile bootstrap/templates/conftest.py
      - name: Validate ADR numbering
        run: |
          expected=1
          for f in docs/decisions/[0-9]*.md; do
            n=$(basename "$f" | cut -c1-4 | sed 's/^0*//')
            if [ "$n" != "$expected" ]; then
              echo "ADR numbering gap: expected $expected, got $n at $f"
              exit 1
            fi
            expected=$((expected + 1))
          done

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check.json'
          folder-path: 'docs, bootstrap'

  gate-audit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Run gate-audit test suite
        run: bash bootstrap/scripts/test-gate-audit.sh
      - name: Validate fixture against aggregation (decision-rule smoke test)
        run: |
          bash bootstrap/scripts/gate-audit-aggregate.sh \
            --events-file docs/gate-audit/fixtures/events-4w-sample.jsonl \
            --output-dir /tmp/gate-audit-smoke \
            --dry-run

  gate-audit-weekly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3
          gh --version
      - name: Configure git for bot commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
      - name: Run gate-audit aggregation
        run: |
          bash bootstrap/scripts/gate-audit-aggregate.sh \
            --events-file docs/gate-audit/events.jsonl \
            --output-dir docs/gate-audit
      - name: Open PR with weekly report (preserves branch-protection on main)
        # Opens a PR rather than pushing directly to main, so ADR-0009 branch-protection
        # and governance remain intact. The PR is reviewed and merged by a human.
        # Workflow run URL is embedded in the commit body for auditability.
        run: |
          if git diff --quiet; then
            echo "No changes — events.jsonl may be empty or unchanged"
            exit 0
          fi
          WEEK=$(python3 -c "from datetime import date; d=date.today(); print(str(d.isocalendar()[0])+'-W%02d'%d.isocalendar()[1])")
          BRANCH="chore/gate-audit-${WEEK}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add docs/gate-audit/
          git commit -m "chore(gate-audit): weekly report ${WEEK}" \
                     -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(gate-audit): weekly report ${WEEK}" \
            --body "Automated weekly gate-audit report. Review recommendations before merging. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "type:bootstrap" \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
