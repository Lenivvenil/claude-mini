name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to read-only token for all jobs.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: '.'

  setup-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Bash syntax check all scripts
        run: |
          find bootstrap -name "*.sh" -print0 | xargs -0 -I{} bash -n {}
      - name: Lint prompt artifacts
        run: |
          shopt -s nullglob
          bash scripts/lint-prompts.sh bootstrap/agents/*.md plugin/agents/*.md bootstrap/commands/*.md bootstrap/skills/*/SKILL.md plugin/skills/*/SKILL.md
      - name: Validate JSON/YAML
        run: |
          for f in bootstrap/templates/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))"
          done
      - name: Validate conftest.py template syntax
        run: python3 -m py_compile bootstrap/templates/conftest.py
      - name: Validate ADR numbering
        run: |
          expected=1
          for f in docs/decisions/[0-9]*.md; do
            n=$(basename "$f" | cut -c1-4 | sed 's/^0*//')
            if [ "$n" != "$expected" ]; then
              echo "ADR numbering gap: expected $expected, got $n at $f"
              exit 1
            fi
            expected=$((expected + 1))
          done
      - name: Validate Python scripts syntax (SARIF converters + filter)
        run: |
          for f in bootstrap/scripts/mutmut-to-sarif.py \
                   bootstrap/scripts/filter-mypy-invalid.py \
                   bootstrap/scripts/cargo-mutants-to-sarif.py; do
            python3 -m py_compile "$f" || { echo "Syntax error in $f"; exit 1; }
          done
      - name: Run mutation-summary unit tests
        run: bash bootstrap/scripts/test-mutation-summary.sh

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check.json'
          folder-path: 'docs, bootstrap'

  install-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Run install verification test harness
        run: bash bootstrap/scripts/test-install-verification.sh

  plugin-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Plugin commit-msg hook cases (#308)
        run: bash plugin/scripts/test-commit-msg-check.sh

  mcp-config-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Lint .mcp.json against ADR-0028 transport security policy
        run: bash bootstrap/scripts/check-mcp-config.sh .mcp.json
      - name: Run check-mcp-config unit tests
        run: bash bootstrap/scripts/test-check-mcp-config.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Scan for hardcoded secrets
        run: |
          fail=0
          # PEM-style private key headers — never legitimate in this repo.
          # Scans all text files (--binary-files=without-match skips binaries).
          # -e: the pattern starts with '-' and would otherwise be parsed as an option.
          # grep rc: 0 = match, 1 = clean, >1 = scanner error (must fail, never read as clean).
          rc=0
          grep -rn --binary-files=without-match --exclude-dir=.git \
               -E -e '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY' . || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::Private key header found — remove before committing"
            fail=1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::secret scan: grep failed (rc=$rc) — scanner error, not a clean result"
            fail=1
          fi
          # Credential assignments with literal values (excludes env var refs like $TOKEN or ${{ secrets.X }}).
          # Covers .sh, .py, .yml, .yaml, .json, .toml, .env, and all other text files.
          # {20,}: minimum 20 chars = practical threshold for real credential length;
          # shorter random strings are unlikely to be production secrets.
          # Known limitation: fires on pull_request [opened, synchronize, reopened]
          # but NOT on PR body edits — process gate only, not a security boundary.
          rc=0
          grep -rn --binary-files=without-match --exclude-dir=.git \
               -E -e '(PASSWORD|SECRET|TOKEN|API_KEY|APIKEY|PRIVATE_KEY)\s*=\s*[^$\{][a-zA-Z0-9+/]{20,}' \
               . || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::Potential hardcoded credential found — use env vars or GitHub Secrets"
            fail=1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::secret scan: grep failed (rc=$rc) — scanner error, not a clean result"
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            echo "Secret scan clean."
          fi
          exit "$fail"

  pr-body-check:
    # Process gate: enforces PR body contains issue cross-reference (DoD norm).
    # Known gap: fires on pull_request [opened, synchronize, reopened] but NOT on
    # PR body edits (GitHub does not re-trigger `pull_request` on body edits by default).
    # This is a governance process gate, not a security boundary — the gap is acceptable
    # and tracked in issue #203. To close it: add `types: [opened, synchronize, reopened, edited]`
    # to the workflow `pull_request:` trigger (would re-run all PR jobs on body edits).
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - name: Verify PR body contains issue cross-reference
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # -i: case-insensitive so 'closes #123' also matches.
          # Requires a keyword prefix (Closes/Fixes/Resolves/Implements) — deliberate tightening
          # compared to the commit-msg governance hook (which accepts bare #NNN anywhere).
          # The DoD norm specifies 'Closes #NNN'; this check enforces that intent.
          if echo "$PR_BODY" | grep -iqE 'Closes\s+#[0-9]+|Fixes\s+#[0-9]+|Resolves\s+#[0-9]+|Implements\s+#[0-9]+'; then
            echo "PR body contains issue cross-reference — OK"
          else
            echo "::error::PR body must reference an issue with a keyword prefix (e.g., 'Closes #123'). Add it and push again."
            echo "PR body received (first 300 chars): ${PR_BODY:0:300}"
            exit 1
          fi

  mini-preflight-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Run mini-preflight test suite
        run: bash bootstrap/scripts/test-mini-preflight.sh

  gate-audit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Run gate-audit test suite
        run: bash bootstrap/scripts/test-gate-audit.sh
      - name: Validate fixture against aggregation (decision-rule smoke test)
        run: |
          bash bootstrap/scripts/gate-audit-aggregate.sh \
            --events-file docs/gate-audit/fixtures/events-4w-sample.jsonl \
            --output-dir /tmp/gate-audit-smoke \
            --dry-run


  adr-retirement-audit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run ADR retirement audit test suite
        run: bash bootstrap/scripts/test-adr-retirement-audit.sh

