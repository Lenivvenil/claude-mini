name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC — weekly gate-audit run

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: '.'

  setup-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Bash syntax check all scripts
        run: |
          find bootstrap -name "*.sh" -print0 | xargs -0 -I{} bash -n {}
      - name: Lint prompt artifacts
        run: |
          shopt -s nullglob
          bash scripts/lint-prompts.sh bootstrap/agents/*.md bootstrap/commands/*.md bootstrap/skills/*/SKILL.md
      - name: Validate JSON/YAML
        run: |
          for f in bootstrap/templates/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))"
          done
      - name: Validate conftest.py template syntax
        run: python3 -m py_compile bootstrap/templates/conftest.py
      - name: Validate ADR numbering
        run: |
          expected=1
          for f in docs/decisions/[0-9]*.md; do
            n=$(basename "$f" | cut -c1-4 | sed 's/^0*//')
            if [ "$n" != "$expected" ]; then
              echo "ADR numbering gap: expected $expected, got $n at $f"
              exit 1
            fi
            expected=$((expected + 1))
          done
      - name: Template drift check (mutation.yml)
        run: |
          if [ ! -f .github/workflows/mutation.yml ]; then
            echo "MISSING: .github/workflows/mutation.yml not found in checkout"
            exit 1
          elif [ ! -f bootstrap/templates/mutation.yml ]; then
            echo "MISSING: bootstrap/templates/mutation.yml not found in checkout"
            exit 1
          elif ! cmp -s .github/workflows/mutation.yml bootstrap/templates/mutation.yml; then
            echo "DRIFT: .github/workflows/mutation.yml differs from bootstrap/templates/mutation.yml"
            exit 1
          fi
      - name: Validate Python scripts syntax (SARIF converters + filter)
        run: |
          for f in bootstrap/scripts/mutmut-to-sarif.py \
                   bootstrap/scripts/filter-mypy-invalid.py \
                   bootstrap/scripts/cargo-mutants-to-sarif.py; do
            python3 -m py_compile "$f" || { echo "Syntax error in $f"; exit 1; }
          done
      - name: Run mutation-summary unit tests
        run: bash bootstrap/scripts/test-mutation-summary.sh

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check.json'
          folder-path: 'docs, bootstrap'

  gate-audit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Run gate-audit test suite
        run: bash bootstrap/scripts/test-gate-audit.sh
      - name: Validate fixture against aggregation (decision-rule smoke test)
        run: |
          bash bootstrap/scripts/gate-audit-aggregate.sh \
            --events-file docs/gate-audit/fixtures/events-4w-sample.jsonl \
            --output-dir /tmp/gate-audit-smoke \
            --dry-run

  gate-audit-weekly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3
          gh --version
      - name: Configure git for bot commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
      - name: Run gate-audit aggregation
        run: |
          bash bootstrap/scripts/gate-audit-aggregate.sh \
            --events-file docs/gate-audit/events.jsonl \
            --output-dir docs/gate-audit
      - name: Open PR with weekly report (preserves branch-protection on main)
        # Opens a PR rather than pushing directly to main, so ADR-0009 branch-protection
        # and governance remain intact. The PR is reviewed and merged by a human.
        # Workflow run URL is embedded in the commit body for auditability.
        run: |
          if git diff --quiet; then
            echo "No changes — events.jsonl may be empty or unchanged"
            exit 0
          fi
          WEEK=$(python3 -c "from datetime import date; d=date.today(); print(str(d.isocalendar()[0])+'-W%02d'%d.isocalendar()[1])")
          BRANCH="chore/gate-audit-${WEEK}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add docs/gate-audit/
          git commit -m "chore(gate-audit): weekly report ${WEEK}" \
                     -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(gate-audit): weekly report ${WEEK}" \
            --body "Automated weekly gate-audit report. Review recommendations before merging. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "type:bootstrap" \
            --base main \
            --head "$BRANCH" \
          || {
            echo "PR creation failed — deleting orphan branch to prevent accumulation"
            git push origin --delete "$BRANCH" || true
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  adr-retirement-audit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run ADR retirement audit test suite
        run: bash bootstrap/scripts/test-adr-retirement-audit.sh

  adr-retirement-audit-weekly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git for bot commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
      - name: Run ADR retirement audit
        run: |
          bash bootstrap/scripts/adr-retirement-audit.sh \
            > /tmp/adr-retirement-audit-report.md
          cat /tmp/adr-retirement-audit-report.md
      - name: Open PR with weekly report
        # Opens a PR rather than pushing directly to main, preserving ADR-0009 branch-protection.
        # Report is human-reviewed; --apply is never called automatically (non-goal: no auto-tagging).
        run: |
          WEEK=$(python3 -c "from datetime import date; d=date.today(); print(str(d.isocalendar()[0])+'-W%02d'%d.isocalendar()[1])")
          REPORT_DIR="docs/adr-audit"
          mkdir -p "$REPORT_DIR"
          cp /tmp/adr-retirement-audit-report.md "${REPORT_DIR}/${WEEK}.md"
          git add "${REPORT_DIR}/"
          if git diff --cached --quiet; then
            echo "No change in report — all ADRs unchanged since last run"
            exit 0
          fi
          # Deterministic branch name — one PR per ISO week, no duplicates on re-run
          BRANCH="chore/adr-audit-${WEEK}"
          # Fail-closed PR existence check: capture gh exit code separately so auth/API
          # errors do not masquerade as "no open PR found"
          existing_pr=$(gh pr list --head "$BRANCH" --state open --json number \
            --jq '.[0].number' 2>/dev/null) || {
            echo "gh pr list failed — cannot verify whether a PR already exists; aborting to prevent duplicates" >&2
            exit 1
          }
          if echo "$existing_pr" | grep -qE '^[0-9]+$'; then
            echo "Open PR already exists (#${existing_pr}) for ${BRANCH} — skipping"
            exit 0
          fi
          git checkout -b "$BRANCH"
          git commit -m "chore(adr-audit): weekly report ${WEEK}" \
                     -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Use --force-with-lease to handle the edge case where a prior run pushed
          # the branch but the PR was closed without deleting the branch
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --title "chore(adr-audit): weekly staleness report ${WEEK}" \
            --body "$(printf 'Automated weekly ADR retirement audit. Review recommendations before applying any.\n\nTo apply a recommendation:\n```\nbash bootstrap/scripts/adr-retirement-audit.sh --apply 0004\n```\n(Use zero-padded 4-digit number or bare integer, e.g. --apply 4)\n\nRun: %s/%s/actions/runs/%s' \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")" \
            --label "type:bootstrap" \
            --base main \
            --head "$BRANCH" \
          || {
            echo "PR creation failed — deleting orphan branch"
            git push origin --delete "$BRANCH" || true
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
